name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
      - name: Firestore rules tests (emulator)
        run: npm run test:rules
      - name: Storage rules tests (emulator)
        run: npm run test:storage-rules
